name: Daily HubSpot Refresh

on:
  schedule:
    - cron: '0 11 * * *'       # 11:00 UTC = 7:00 AM Eastern (6 AM in winter)
  workflow_dispatch: {}         # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests reportlab

      - name: Pull HubSpot delta into Excel
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python .refresh_work/auto_refresh.py

      - name: Regenerate dashboard data.js
        run: python refresh-data.py

      - name: Run scheduled monthly / quarterly reports if due
        run: python monthly_reports/scheduled_runner.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto refresh"
          file_pattern: 'data/CAPS_RFP_Dashboard_Dataset.xlsx js/data.js *.html monthly_reports/**/*.pdf monthly_reports/manifest.* .refresh_work/.last_pull'
